name: Imagem Docker Appelsoft (rustdesk-api)

# Gera a imagem da API + painel web a partir dos NOSSOS forks
# (rustdesk-api e rustdesk-api-web) e publica no GitHub Container Registry:
#   ghcr.io/mauriciolimadev/rustdesk-api:latest
#   ghcr.io/mauriciolimadev/rustdesk-api:<sha curto>
# Na VPS, fixe a tag <sha> para só atualizar quando quiser.

on:
  workflow_dispatch:
    inputs:
      web_branch:
        description: "Branch do fork rustdesk-api-web"
        required: true
        default: "master"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag curta
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dev
          platforms: linux/amd64
          push: true
          build-args: |
            GO_VERSION=1.23
            FRONTEND_GIT_REPO=https://github.com/${{ github.repository_owner }}/rustdesk-api-web.git
            FRONTEND_GIT_BRANCH=${{ inputs.web_branch }}
          # o GHCR exige nome em minúsculas
          tags: |
            ghcr.io/mauriciolimadev/rustdesk-api:latest
            ghcr.io/mauriciolimadev/rustdesk-api:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
