# Stack completa na VPS (pasta ~/rustdesk):
#   hbbs + hbbr  -> servidor oficial do RustDesk (já em uso)
#   rustdesk-api -> login, livro de endereços, painel web (imagem própria no GHCR)
#   caddy        -> HTTPS automático (Let's Encrypt) na frente da API
#
# Antes de subir:
#   1. DNS: remoto.appelsoft.com.br (registro A) -> IP da VPS
#   2. Para outro domínio, troque aqui e no Caddyfile
#   3. Libere 80/tcp e 443/tcp no firewall. A 21114 NÃO precisa ficar aberta.

services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: "host"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: "host"
    restart: unless-stopped

  rustdesk-api:
    container_name: rustdesk-api
    # Troque "latest" pela tag do commit (ex.: :a1b2c3d) para só atualizar quando quiser
    image: ghcr.io/mauriciolimadev/rustdesk-api:latest
    environment:
      - TZ=America/Sao_Paulo
      - RUSTDESK_API_LANG=pt-BR
      - RUSTDESK_API_RUSTDESK_ID_SERVER=remoto.appelsoft.com.br:21116
      - RUSTDESK_API_RUSTDESK_RELAY_SERVER=remoto.appelsoft.com.br:21117
      - RUSTDESK_API_RUSTDESK_API_SERVER=https://remoto.appelsoft.com.br
      - RUSTDESK_API_RUSTDESK_KEY_FILE=/data/id_ed25519.pub
      - RUSTDESK_API_APP_REGISTER=false
      - RUSTDESK_API_APP_WEB_CLIENT=0
      - RUSTDESK_API_APP_BAN_THRESHOLD=10
      - RUSTDESK_API_GIN_TRUST_PROXY=127.0.0.1
    volumes:
      - ./data:/data:ro              # só lê o id_ed25519.pub
      - ./api-data:/app/data         # banco SQLite (fazer backup!)
      - ./downloads:/app/downloads:ro  # cliente.exe e equipe.exe (página Downloads do painel)
    ports:
      - "127.0.0.1:21114:21114"      # só a própria VPS acessa; o público entra pelo Caddy
    restart: unless-stopped

  caddy:
    container_name: caddy
    image: caddy:2
    network_mode: "host"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # A rota do Caddyfile aponta fixo para cliente.exe; o equipe.exe não tem rota pública
      - ./downloads:/srv/downloads:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      - rustdesk-api
    restart: unless-stopped
